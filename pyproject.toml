[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-macos-agent"
version = "0.1.0"
description = "JARVIS macOS agent — Phase 6"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]
browser = ["playwright>=1.50,<2"]
macos = ["pyobjc-framework-Cocoa>=10,<12", "pyobjc-framework-Quartz>=10,<12", "pyobjc-framework-Vision>=10,<12"]

[project.scripts]
jarvis = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
